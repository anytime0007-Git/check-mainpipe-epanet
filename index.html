<title>Route Check Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar with import control, KPI band, route matrix, then two-column analysis panels and filterable tables; route detail opens as a side panel. */
:root{
  --bg:#eef3f6; --surface:#ffffff; --ink:#10212c; --ink2:#46596a; --muted:#74889a; --line:#d9e3ea; --wash:#f4f8fa;
  --accent:#0b6e99; --accent-ink:#ffffff;
  --good:#2b8a57; --warn:#d68a1f; --bad:#c43f2d; --info:#8da0ae;
  --c1:#7a5af8; --c2:#0b9fb0; --c3:#e0663a; --c4:#2f6fe0; --c5:#d2478f;
  --font:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b151c; --surface:#12212b; --ink:#e5eef3; --ink2:#a8bac6; --muted:#7d919f; --line:#233745; --wash:#0f1c25;
  --accent:#4fb3dd; --accent-ink:#06202c; --good:#46b97f; --warn:#e8a94a; --bad:#ee6e5c; --info:#6f8696; --c1:#a48dff; --c2:#38c7d8; --c3:#f08a5d; --c4:#6a9cf5; --c5:#ee7db5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b151c; --surface:#12212b; --ink:#e5eef3; --ink2:#a8bac6; --muted:#7d919f; --line:#233745; --wash:#0f1c25;
  --accent:#4fb3dd; --accent-ink:#06202c; --good:#46b97f; --warn:#e8a94a; --bad:#ee6e5c; --info:#6f8696; --c1:#a48dff; --c2:#38c7d8; --c3:#f08a5d; --c4:#6a9cf5; --c5:#ee7db5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:15px;margin:0;font-weight:600}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.muted{color:var(--muted)} .small{font-size:12px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1280px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.top-meta .small{overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.drop{display:none;position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--accent) 18%,transparent);border:3px dashed var(--accent);align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--ink)}
.drop.on{display:flex}
.note{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.note.err{border-left-color:var(--bad)}
.deltas{display:flex;flex-wrap:wrap;gap:6px 16px}
.dl{display:flex;gap:6px;align-items:baseline}
.up{color:var(--bad)} .dn{color:var(--good)} .eq{color:var(--muted)}
/* KPI */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr);gap:16px}
@media(max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.big{font-size:44px;line-height:1.05;font-weight:700;font-family:var(--mono);letter-spacing:-1px}
.big small{font-size:18px;color:var(--muted);font-weight:400;letter-spacing:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--wash)}
.tile .v{font-size:24px;font-weight:600;font-family:var(--mono);line-height:1.2}
.tile .l{font-size:12px;color:var(--ink2)}
.tile .s{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
/* bars */
.seg{display:flex;gap:2px;height:14px}
.seg>i{display:block;border-radius:2px;min-width:2px}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(80px,150px) minmax(0,1fr) 78px;gap:10px;align-items:center}
.row .lb{font-size:13px;overflow-wrap:anywhere}
.row .vl{text-align:right;font-size:12px;color:var(--ink2)}
.track{height:12px;background:var(--wash);border-radius:2px;display:flex;gap:2px}
.track>i{display:block;border-radius:2px}
/* matrix */
.matrix{display:flex;flex-wrap:wrap;gap:10px 16px}
.mg{display:flex;align-items:center;gap:6px}
.mg b{font-size:11px;color:var(--muted);font-family:var(--mono);font-weight:500;min-width:26px}
.cells{display:flex;gap:3px;flex-wrap:wrap}
.c{width:18px;height:18px;border-radius:3px;border:0;padding:0}
.c:hover{outline:2px solid var(--ink);outline-offset:1px}
/* controls */
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:12px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;min-width:180px;flex:1;max-width:320px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--wash);font-weight:600;font-size:12px;color:var(--ink2);white-space:nowrap;position:sticky;top:0}
th button{background:none;border:0;padding:0;font-weight:inherit;color:inherit}
th button:hover{color:var(--accent)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--wash)}
td.r,th.r{text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:2px;display:inline-block}
.more{align-self:flex-start}
/* detail */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,15,22,.45);display:none}
.scrim.on{display:block}
.side{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px;display:none;flex-direction:column;gap:14px}
.side.on{display:flex}
.codes{display:flex;flex-direction:column;gap:10px}
.cg{display:flex;flex-direction:column;gap:6px}
.cg>div:first-child{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.code{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:5px;border:1px solid var(--line);background:var(--wash);display:inline-flex;gap:6px;align-items:baseline;cursor:text;user-select:all}
.code small{color:var(--muted);font-size:10px}
.code.bad{border-color:var(--bad);color:var(--bad)}
.iss{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.iss:last-child{border:0}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:5px;font-size:12px;max-width:280px;display:none;overflow-wrap:anywhere}
.empty{padding:20px;text-align:center;color:var(--muted)}
.logo{display:inline-flex;width:34px;height:34px;border-radius:10px;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,var(--accent),var(--c2));margin-right:10px;flex:none}
.title-row{display:flex;align-items:center}
.hero .panel:first-child{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),color-mix(in srgb,var(--c1) 10%,var(--surface)))}
.tile{border-top:3px solid var(--tc,var(--line))}
.tile .e{font-size:18px;line-height:1}
.tile .v{display:flex;align-items:center;gap:8px}
.mood{font-size:40px;line-height:1;margin-left:8px}
.bigrow{display:flex;align-items:center;flex-wrap:wrap}
.rank{font-size:16px;margin-right:6px}
.c{transition:transform .12s}.c:hover{transform:scale(1.35)}
@media(prefers-reduced-motion:reduce){.c{transition:none}.c:hover{transform:none}}
@media(prefers-reduced-motion:no-preference){.tile{transition:transform .15s}.tile:hover{transform:translateY(-2px)}.btn,.chip{transition:border-color .12s,background .12s}}
</style>

<div class="top"><div class="top-in">

</div></div>

/* ---------- data ---------- */
function sheetRows(wb,name,cols){
  const ws=wb.Sheets[name]; if(!ws) throw new Error('ไม่พบ sheet "'+name+'"');
  const rows=XLSX.utils.sheet_to_json(ws,{defval:null,raw:true});
  if(cols&&rows.length){for(const c of cols) if(!(c in rows[0])) throw new Error('sheet "'+name+'" ไม่มีคอลัมน์ "'+c+'"');}
  return rows;
}
function parseWorkbook(wb){
  const summary=sheetRows(wb,'Summary',['item','value']);
  const routes=sheetRows(wb,'RouteSummary',['route','status','errors','warns','missing_summary']);
  const issues=sheetRows(wb,'Issues',['severity','category','route','message']);
  const prep=sheetRows(wb,'ToPrepare',['category','equ_name','routes']);
  const eq=sheetRows(wb,'Equipment',['route','equ','position']);
  const pipe=sheetRows(wb,'PipeAttrs',['route']);
  const keepE=['route','equ','roles','position','type','loc_found','dist_to_pipe_m','data_found','has_flow','has_pressure'];
  const equip=eq.map(r=>{const o={};for(const k of keepE)o[k]=r[k]??null;if(o.dist_to_pipe_m!=null)o.dist_to_pipe_m=Math.round(o.dist_to_pipe_m*10)/10;return o});
  const keepP=['route','shp_found','n_pipes','inst_year_null','combine_not_in_pipeid','length_m'];
  return {summary,routes,issues,prep,equip,pipe:pipe.map(r=>{const o={};for(const k of keepP)o[k]=r[k]??null;return o})};
}
const sv=(d,key)=>{const r=d.summary.find(x=>String(x.item).trim().startsWith(key));return r?r.value:null};
function kpis(d){
  const c={};for(const s of Object.values(ST))c[s]=d.routes.filter(r=>r.status===s).length;
  return {
    'route ทั้งหมด':d.routes.length, 'สมบูรณ์':c[ST.c], 'ข้อมูลไม่ครบ':c[ST.p], 'ยังไม่พร้อม':c[ST.n],

}

/* ---------- pieces ---------- */
function seg(parts,total,h){
  const t=total??parts.reduce((a,p)=>a+p.v,0);
  return `<div class="seg" ${h?`style="height:${h}px"`:''}>${parts.filter(p=>p.v>0).map(p=>`<i style="flex:${p.v};background:${p.c}" data-tip="${esc(p.l)}: ${fmt(p.v)} (${pct(p.v,t)}%)"></i>`).join('')}</div>`;
}
function legend(items){return `<div class="legend">${items.map(([l,c])=>`<span><i style="background:${c}"></i>${esc(l)}</span>`).join('')}</div>`}
function pill(st){return `<span class="pill"><span aria-hidden="true">${ST_EMO[st]||'•'}</span>${esc(st)}</span>`}
function checkRows(src,agg){
  // src: array of route rows (aggregate) or single row
  const rows=Array.isArray(src)?src:[src];
  return CHECKS.map(([name,tot,subs])=>{
    const T=rows.reduce((a,r)=>a+(+r[tot]||0),0);
    if(!T) return '';
    return `<div class="rows"><div class="small muted" style="font-weight:600">${esc(name)} · ${fmt(T)} จุด</div>`+
    subs.map(([l,k])=>{const ok=rows.reduce((a,r)=>a+(+r[k]||0),0);const bad=Math.max(T-ok,0);
      return `<div class="row"><span class="lb">${esc(l)}</span>
      <div class="track">${ok?`<i style="flex:${ok};background:var(--good)" data-tip="ใช้ได้ ${fmt(ok)}"></i>`:''}${bad?`<i style="flex:${bad};background:var(--bad)" data-tip="ไม่ผ่าน ${fmt(bad)}"></i>`:''}</div>
      <span class="vl num">${fmt(ok)}/${fmt(T)}</span></div>`}).join('')+`</div>`;
  }).join('');
}

  ${delta}
  <section class="hero">

      ${seg([{l:ST.c,v:nC,c:ST_COLOR[ST.c]},{l:ST.p,v:nP,c:ST_COLOR[ST.p]},{l:ST.n,v:nN,c:ST_COLOR[ST.n]}],total,18)}
      ${legend([[`✅ ${ST.c} ${nC}`,ST_COLOR[ST.c]],[`⚠️ ${ST.p} ${nP}`,ST_COLOR[ST.p]],[`⛔ ${ST.n} ${nN}`,ST_COLOR[ST.n]]])}
      <div class="small muted">ตรวจเมื่อ ${esc(checked)} · ${fmt(sv(D,'จุดอุปกรณ์'))} จุดอุปกรณ์ · ${fmt(sv(D,'ชื่ออุปกรณ์ไม่ซ้ำ'))} ชื่อไม่ซ้ำ</div>
    </div>
    <div class="panel">
      <h2>🔧 ประเด็นที่ต้องแก้</h2>

        <div class="tile" style="--tc:var(--bad)"><span class="v" style="color:var(--bad)"><span class="e" aria-hidden="true">🚨</span>${fmt(K['ผิดพลาด (ERROR)'])}</span><span class="l">ข้อผิดพลาด (ERROR)</span></div>
        <div class="tile" style="--tc:var(--warn)"><span class="v" style="color:var(--warn)"><span class="e" aria-hidden="true">⚠️</span>${fmt(K['เตือน (WARN)'])}</span><span class="l">คำเตือน (WARN)</span></div>
        <div class="tile" style="--tc:var(--c2)"><span class="v"><span class="e" aria-hidden="true">📍</span>${fmt(K['ไม่มีพิกัด'])}</span><span class="l">ชื่อที่ไม่มีพิกัด</span></div>
        <div class="tile" style="--tc:var(--c1)"><span class="v"><span class="e" aria-hidden="true">📊</span>${fmt(K['ไม่มีข้อมูล PUUZ/DM'])}</span><span class="l">ไม่มีข้อมูลใน PUUZ/DM</span></div>
        <div class="tile" style="--tc:var(--c4)"><span class="v"><span class="e" aria-hidden="true">🌊</span>${fmt(K['ไม่มี flow'])}</span><span class="l">ไม่มี flow</span></div>
        <div class="tile" style="--tc:var(--c3)"><span class="v"><span class="e" aria-hidden="true">⏱️</span>${fmt(K['ไม่มี pressure'])}</span><span class="l">ไม่มี pressure</span></div>
        <div class="tile" style="--tc:var(--c5)"><span class="v"><span class="e" aria-hidden="true">🗂️</span>${fmt(K['route ไม่มี SHP'])}</span><span class="l">route ไม่มีไฟล์ SHP</span></div>
        <div class="tile" style="--tc:var(--accent)"><span class="v"><span class="e" aria-hidden="true">🔁</span>${fmt(sv(D,'ชื่อซ้ำใน relation'))}</span><span class="l">ชื่อซ้ำใน relation</span></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-h"><h2>🗺️ แผนผัง route ทั้งหมด</h2><span class="small muted">คลิกช่องเพื่อดูรายละเอียด</span></div>
    <div class="matrix">${matrix}</div>
    ${legend([[ST.c,ST_COLOR[ST.c]],[ST.p,ST_COLOR[ST.p]],[ST.n,ST_COLOR[ST.n]]])}

  <section class="grid2">
    <div class="panel"><div class="panel-h"><h2>🧩 ประเด็นแยกตามหมวด</h2><span class="small muted">${fmt(D.issues.length)} รายการ</span></div>
      <div class="rows">${catRows}</div>${legend([['ผิดพลาด',SEV_COLOR.ERROR],['เตือน',SEV_COLOR.WARN],['ข้อมูล',SEV_COLOR.INFO]])}</div>
    <div class="panel"><div class="panel-h"><h2>📦 อุปกรณ์ที่ต้องเตรียมข้อมูล</h2><span class="small muted">${fmt(D.prep.length)} รายการ</span></div>
      <div class="rows">${prepRows}</div></div>

  <section class="grid2">
    <div class="panel"><h2>🎯 ความครบถ้วนแยกตามประเภทจุด</h2>${checkRows(R)}

        <div class="tiles">
          <div class="tile" style="--tc:var(--c2)"><span class="v"><span class="e" aria-hidden="true">🔩</span>${fmt(nPipes)}</span><span class="l">ท่อทั้งหมด</span></div>
          <div class="tile" style="--tc:var(--c4)"><span class="v"><span class="e" aria-hidden="true">📏</span>${fmt(Math.round(lenKm))}</span><span class="l">ความยาวรวม (กม.)</span></div>
          <div class="tile" style="--tc:var(--c3)"><span class="v"><span class="e" aria-hidden="true">📅</span>${fmt(yrNull)}</span><span class="l">ท่อไม่มีปีติดตั้ง</span></div>

        </div>
        ${noShp.length?`<div class="small"><b>ไม่มีไฟล์ SHP:</b> ${noShp.map(p=>`<a href="#" data-route="${esc(p.route)}">${esc(p.route)}</a>`).join(', ')}</div>`:''}
        ${yrTop.length?`<div class="small muted">ปีติดตั้งว่างมากสุด: ${yrTop.map(p=>`<a href="#" data-route="${esc(p.route)}">${esc(p.route)}</a> (${p.inst_year_null})`).join(' · ')}</div>`:''}

    <div class="ctrl" id="pctrl"></div>
    <div class="tw" style="max-height:560px"><table><thead><tr><th>หมวด</th><th>อุปกรณ์</th><th>ตำแหน่ง</th><th class="r">route</th><th>รายละเอียด</th></tr></thead><tbody id="pbody"></tbody></table></div>
    <button class="btn more" id="pmore" hidden>แสดงเพิ่ม</button>
  </section>`;
  drawRoutes(); drawPrep();
}

function drawRoutes(){
  const R=D.routes;
  const counts={};for(const r of R)counts[r.status]=(counts[r.status]||0)+1;
  $('#rctrl').innerHTML=`<input type="search" id="rq" placeholder="ค้นหา route หรือประเด็น" value="${esc(routeQ)}" aria-label="ค้นหา route">
    <button class="chip" data-f="" aria-pressed="${routeFilter==null}">ทั้งหมด ${R.length}</button>
    ${Object.values(ST).map(s=>`<button class="chip" data-f="${esc(s)}" aria-pressed="${routeFilter===s}">${esc(s)} ${counts[s]||0}</button>`).join('')}`;
  const cols=[['route','route'],['status','สถานะ'],['pipes','ท่อ',1],['length_m','ยาว (กม.)',1],['errors','ERROR',1],['warns','WARN',1],['missing_summary','ประเด็นที่พบ']];
  $('#rhead').innerHTML=cols.map(([k,l,r])=>`<th class="${r?'r':''}"><button data-s="${k}">${l}${routeSort[0]===k?(routeSort[1]>0?' ▲':' ▼'):''}</button></th>`).join('');
  const q=routeQ.trim().toLowerCase();
  let rows=R.filter(r=>(routeFilter==null||r.status===routeFilter)&&(!q||(r.route+' '+(r.missing_summary||'')).toLowerCase().includes(q)));
  const [k,dir]=routeSort;
  rows.sort((a,b)=>{let x=a[k],y=b[k];if(k==='status'){x=ST_ORDER[x]??9;y=ST_ORDER[y]??9;return (x-y)*dir||(a.route<b.route?-1:1)}
    if(typeof x==='number'||typeof y==='number')return ((+x||0)-(+y||0))*dir;return String(x??'').localeCompare(String(y??''))*dir});
  $('#rcount').textContent=`แสดง ${rows.length} จาก ${R.length}`;
  $('#rbody').innerHTML=rows.length?rows.map(r=>`<tr class="click" data-route="${esc(r.route)}"><td class="num">${esc(r.route)}</td><td>${pill(r.status)}</td><td class="r num">${fmt(r.pipes)}</td><td class="r num">${r.length_m!=null?(r.length_m/1000).toFixed(1):'-'}</td><td class="r num">${fmt(r.errors)}</td><td class="r num">${fmt(r.warns)}</td><td>${esc(r.missing_summary)}</td></tr>`).join(''):`<tr><td colspan="7" class="empty">ไม่พบ route ที่ตรงกับเงื่อนไข</td></tr>`;
}
function drawPrep(){
  const cats={};for(const p of D.prep)cats[p.category]=(cats[p.category]||0)+1;
  $('#pctrl').innerHTML=`<input type="search" id="pq" placeholder="ค้นหาอุปกรณ์หรือ route" value="${esc(prepQ)}" aria-label="ค้นหาอุปกรณ์">
   <button class="chip" data-pc="" aria-pressed="${prepCat==null}">ทั้งหมด ${D.prep.length}</button>
   ${Object.entries(cats).map(([c,n])=>`<button class="chip" data-pc="${esc(c)}" aria-pressed="${prepCat===c}">${esc(c)} ${n}</button>`).join('')}`;
  const q=prepQ.trim().toLowerCase();
  const rows=D.prep.filter(p=>(prepCat==null||p.category===prepCat)&&(!q||(p.equ_name+' '+p.routes).toLowerCase().includes(q)));
  $('#pcount').textContent=`แสดง ${Math.min(prepShown,rows.length)} จาก ${rows.length}`;
  $('#pbody').innerHTML=rows.slice(0,prepShown).map(p=>`<tr><td>${esc(p.category)}</td><td class="num">${esc(p.equ_name)}</td><td>${esc(p.position||'')}${p.type?' · '+esc(p.type):''}</td><td class="r num">${fmt(p.n_routes)}</td><td><div class="small">${(String(p.routes||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,6)).map(r=>`<a href="#" data-route="${esc(r)}">${esc(r)}</a>`).join(', ')}${p.n_routes>6?' …':''}</div><div class="small muted">${esc(p.detail||'')}</div></td></tr>`).join('')||`<tr><td colspan="5" class="empty">ไม่พบรายการ</td></tr>`;
  $('#pmore').hidden=rows.length<=prepShown;
}

/* ---------- detail panel ---------- */
function openRoute(id){
  const r=D.routes.find(x=>x.route===id); if(!r)return;
  const iss=D.issues.filter(i=>i.route===id).sort((a,b)=>({ERROR:0,WARN:1,INFO:2}[a.severity]-{ERROR:0,WARN:1,INFO:2}[b.severity]));
  const pa=D.pipe.find(p=>p.route===id)||{};
  const eq=D.equip.filter(e=>e.route===id&&(e.loc_found===false||(e.position!=='METER'&&(e.data_found===false||e.has_flow===false||e.has_pressure===false))));
  const flags=e=>[e.loc_found===false&&'ไม่มีพิกัด',e.position!=='METER'&&e.data_found===false&&'ไม่มีข้อมูล',e.position!=='METER'&&e.data_found!==false&&e.has_flow===false&&'ไม่มี flow',e.position!=='METER'&&e.data_found!==false&&e.has_pressure===false&&'ไม่มี pressure'].filter(Boolean).join(', ');
  $('#side').innerHTML=`
   <div class="panel-h"><div><h2 class="num" style="font-size:18px">${esc(id)}</h2>${pill(r.status)}</div><button class="btn" id="close">ปิด</button></div>
   <div class="tiles">
     <div class="tile"><span class="v">${fmt(r.pipes)}</span><span class="l">ท่อ</span></div>
     <div class="tile"><span class="v">${r.length_m!=null?(r.length_m/1000).toFixed(1):'-'}</span><span class="l">ความยาว (กม.)</span></div>
     <div class="tile"><span class="v" style="color:var(--bad)">${fmt(r.errors)}</span><span class="l">ERROR</span></div>
     <div class="tile"><span class="v" style="color:var(--warn)">${fmt(r.warns)}</span><span class="l">WARN</span></div>
   </div>
   <div class="small muted">ปีติดตั้งว่าง ${fmt(pa.inst_year_null)} · ไฟล์ SHP ${r.shp_found||'-'} · อยู่ใน DMA use: ${esc(r.in_dmause||'-')}</div>
   <h2>🏷️ รหัสอุปกรณ์ของ route</h2>
   ${codesHtml(id)}
   ${checkRows(r)}
   <h2>🔎 ประเด็นที่พบ (${iss.length})</h2>
   <div>${iss.map(i=>`<div class="iss"><div><span class="pill"><i style="background:${SEV_COLOR[i.severity]}"></i>${SEV_TH[i.severity]||esc(i.severity)}</span> <span class="small muted">${esc(i.category)}</span> <b class="num small">${esc(i.equ_or_item||'')}</b></div><div>${esc(i.message)}</div>${i.suggestion?`<div class="small muted">แนวทาง: ${esc(i.suggestion)}</div>`:''}</div>`).join('')||'<div class="empty">ไม่มีประเด็น</div>'}</div>
   ${eq.length?`<h2>🧯 อุปกรณ์ที่ข้อมูลไม่ครบ (${eq.length})</h2><div class="tw"><table><tbody>${eq.slice(0,80).map(e=>`<tr><td class="num">${esc(e.equ)}</td><td>${esc(e.position)} ${esc(e.type||'')}</td><td>${esc(flags(e))}</td></tr>`).join('')}</tbody></table></div>`:''}`;
  $('#side').classList.add('on');$('#scrim').classList.add('on');
  $('#side').scrollTop=0;$('#close').focus();
}
function codesHtml(id){
  const all=D.equip.filter(e=>e.route===id);
  const has=(e,k)=>String(e.roles||'').split('+').includes(k);
  const groups=[['⬇️ IN (ทางเข้า)',all.filter(e=>e.position!=='METER'&&has(e,'IN'))],
                ['⬆️ OUT (ทางออก)',all.filter(e=>e.position!=='METER'&&has(e,'OUT'))],
                ['🧮 METER (มาตรวัดน้ำ)',all.filter(e=>e.position==='METER')]];
  const bad=e=>e.loc_found===false||(e.position!=='METER'&&(e.data_found===false||e.has_flow===false||e.has_pressure===false));
  return '<div class="codes">'+groups.map(([l,es])=>`<div class="cg"><div>${l} <span class="muted small num">${es.length} รายการ</span></div>${es.length?`<div class="chips">${es.map(e=>`<span class="code${bad(e)?' bad':''}" data-tip="${esc(e.position)} ${esc(e.type||'')}${bad(e)?' · ข้อมูลไม่ครบ':''}">${esc(e.equ)}<small>${esc(e.type||'')}</small></span>`).join('')}</div>`:'<div class="small muted">ไม่มี</div>'}</div>`).join('')+'<div class="small muted">รหัสสีแดง = พิกัดหรือข้อมูลตรวจวัดไม่ครบ</div></div>';
}
function closeSide(){$('#side').classList.remove('on');$('#scrim').classList.remove('on')}

/* ---------- import ---------- */
function showErr(msg){
  const old=$('#app .note.err');if(old)old.remove();
  $('#app').insertAdjacentHTML('afterbegin',`<div class="note err"><b>นำเข้าไม่สำเร็จ</b><div>${esc(msg)}</div><div class="small muted">ใช้ไฟล์ผลตรวจ route_check ที่มี sheet Summary, RouteSummary, Issues, ToPrepare, Equipment, PipeAttrs</div></div>`);
  scrollTo({top:0});
}
async function importFile(f){
  if(!f)return;
  if(typeof XLSX==='undefined'){showErr('โหลดตัวอ่าน Excel ไม่สำเร็จ ตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่');return}
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const nd=parseWorkbook(wb);
    PREV={k:kpis(D),checked:sv(D,'ตรวจเมื่อ')||'-'};
    D=nd; META={file:f.name,at:new Date().toLocaleString('th-TH'),imported:true};
    try{localStorage.setItem(LS_KEY,JSON.stringify({D,META,PREV}))}catch(e){}
    render();scrollTo({top:0});
  }catch(e){showErr(e.message||String(e))}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const rt=t.closest('[data-route]'); if(rt){e.preventDefault();openRoute(rt.dataset.route);return}
  if(t.closest('#close')||t.id==='scrim'){closeSide();return}
  const f=t.closest('[data-f]'); if(f){routeFilter=f.dataset.f||null;drawRoutes();return}
  const s=t.closest('[data-s]'); if(s){const k=s.dataset.s;routeSort=[k,routeSort[0]===k?-routeSort[1]:1];drawRoutes();return}
  const pc=t.closest('[data-pc]'); if(pc){prepCat=pc.dataset.pc||null;prepShown=40;drawPrep();return}
  if(t.id==='pmore'){prepShown+=80;drawPrep();return}
});
document.addEventListener('input',e=>{
  if(e.target.id==='rq'){routeQ=e.target.value;const p=e.target.selectionStart;drawRoutes();const n=$('#rq');n.focus();n.setSelectionRange(p,p)}
  if(e.target.id==='pq'){prepQ=e.target.value;prepShown=40;const p=e.target.selectionStart;drawPrep();const n=$('#pq');n.focus();n.setSelectionRange(p,p)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSide()});
$('#pick').onclick=()=>$('#file').click();
$('#file').onchange=e=>{importFile(e.target.files[0]);e.target.value=''};
$('#reset').onclick=()=>{try{localStorage.removeItem(LS_KEY)}catch(e){};D=EMBED;META={file:EMBED_META.file};PREV=null;render()};
let dc=0;
addEventListener('dragenter',e=>{e.preventDefault();dc++;$('#drop').classList.add('on')});
addEventListener('dragleave',()=>{if(--dc<=0){dc=0;$('#drop').classList.remove('on')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;$('#drop').classList.remove('on');importFile(e.dataTransfer.files[0])});
// tooltip
const tip=$('#tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}tip.textContent=t.dataset.tip;tip.style.whiteSpace='pre-line';tip.style.display='block'});
document.addEventListener('mousemove',e=>{if(tip.style.display==='none')return;const w=tip.offsetWidth;tip.style.left=Math.min(e.clientX+12,innerWidth-w-8)+'px';tip.style.top=(e.clientY+14)+'px'});

/* ---------- boot ---------- */
D=EMBED;META={file:EMBED_META.file};
try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s&&s.D&&s.D.routes){D=s.D;META=s.META;PREV=s.PREV}}catch(e){}
render();
</script>
